    <meta property="og:title" content="Marketplace circular | Semsus" />

    <link rel="icon" type="image/png" href="https://static.wixstatic.com/media/d7dcb2_6f6be8f20c634c449abfc6a28a8c6af8~mv2.png/v1/fit/w_64,h_64/semsus.png" />

  <body>
    <div id="topo"></div>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow light">Marketplace</span>
        <h1>Produtos com selo de origem</h1>
        <p>Peças criadas por artesãos da rede com material que iria para o aterro. Compre ou troque pelos seus eco-pontos (R$ 1,00 = 10 pontos).</p>
      </div>
    </section>
    <main class="section compacta">
      <div class="container">
        <div class="market-topo">
          <div class="filtros" id="filtros"></div>
          <div class="saldo-box">Seu saldo: <b id="saldo-market">0</b> eco-pontos</div>
        </div>
        <p class="aviso" id="aviso" hidden></p>
        <div class="grade-produtos" id="produtos"></div>
        <p class="nota">Produtos de demonstração. É artesão e quer vender aqui? <a href="/cadastro-artesao.html"><b>Faça seu cadastro</b></a>.</p>
      </div>
    </main>
    <div id="rodape"></div>
    <script type="module" src="/js/semsus/layout.js"></script>
    <script type="module" src="/js/semsus/marketplace.js"></script>
